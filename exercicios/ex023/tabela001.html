<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;

            padding: 10px;
        }
        
        td {
            border: 1px solid rgb(0, 0, 0);
            padding: 8px;
            text-align: center ; /*Alinhamento horizontal*/
            vertical-align: middle; /* Tipos de alinhamento! top, middle, bottom*/
        }
        .num {
            vertical-align: bottom;
        }
        
        

    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>

    <!-- HERARQUIA DE TABELAS (SIMPLES)
         TABLE = tabela
         TABLE ROW = linha de tabela
         TABLE HEAER = cabeçalho de tabela
         TABLE DATA = dado de tabela
    --> 
    <table>
        
        <tr> <!-- Primeira linha -->
            <td>A1</td>
            <td class="num">B1</td>
            <td>C1</td>
        </tr> <!-- Segunda linha -->
        <tr>
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr> <!-- Terceira linha -->
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr> <!-- Quarta linha -->
            <td>A4</td>
            <td class="num">B4 </td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
