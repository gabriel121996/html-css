<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>studo de iframe</title>
    <style>
        iframe {
            width: 400px;
            height: 400px;
            border: 1px solid black;
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do
        <!-- Tamanho padrão do iframe 300x150 px 
         podendo ser alterado no HTML e no CSS
         seguindo uma herarquia que o css controla o estilo que estiver dntro do iframe-->
        <iframe src="https://www.cursoemvideo.com/" frameborder="0" height="300">
            <a href="https://www.cursoemvideo.com/" target="_blank"> Curso em Video</a>
        </iframe>
        
        para aprender a programar.
    </p>
    <p>
        O repositório do Guanabara

            <iframe src="https://gustavoguanabara.github.io/" frameborder="0" width="500" height="500">
                no <a href="https://gustavoguanabara.github.io/" target="_blank">Github</a>
            </iframe>

        também é bem legal!
    </p>
    
</body> 
</html>
