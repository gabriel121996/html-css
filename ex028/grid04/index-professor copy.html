<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Leyout</title>
    <style>
        div.container {
            border: 3px solid darkblue ;
            padding: 5px;
            width: 515px;
            
            
            display: grid;
            grid-template-rows: repeat(8,50px);
            grid-template-columns: repeat(8, 60px);
            /*grid-auto-flow: column;*/
            grid-auto-rows: 100px;
            grid-auto-columns: 120px;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;

            
            
        
        }
        div.item {
            border: 2px solid rgb(139, 0, 132);
            padding: 5px;
            align-content: center;
            text-align: center;
           
        }
        div.caixa1 {
            grid-row-start: 2;
            grid-row-end: 3;
            grid-column-start: 2;
            grid-column-end: 4;

            background-color: rgb(250, 2, 2);
            text-align: center;
            align-content: center;
            color: rgb(255, 255, 255);
            font-weight: bolder;
        }
        div.caixa2 {
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;

            text-align: center;
            align-content: center;
            color: rgb(255, 255, 255);
            font-weight: bolder;
        }
        div.caixa3 {
