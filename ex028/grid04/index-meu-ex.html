<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Leyout</title>
    <style>
        div.container {
            border: 3px solid darkblue ;
            padding: 5px;
            
            
            
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4, 1fr);
            grid-auto-flow: column;
            grid-auto-rows: 100px;
            grid-auto-columns: 120px;
            gap: 5px;
            place-items: normal normal;
            place-content: normal normal;

            
            
        
        }
        div.item {
            border: 2px solid rgb(139, 0, 132);
            padding: 5px;
            align-content: center;
            text-align: center;
           
        }
        div.caixa1 {
            grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;

            background-color: rgb(250, 2, 2);
            text-align: center;
            align-content: center;
            color: rgb(255, 255, 255);
            font-weight: bolder;
        }
        div.caixa2 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;
    
            background-color: rgb(0, 0, 255);
            text-align: center;
            align-content: center;
            color: rgb(255, 255, 255);
            font-weight: bolder;
        }
        div.caixa3 {
            grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;
            
            background-color: rgb(8, 243, 0);
            text-align: center;
            align-content: center;
            color: rgb(255, 247, 247);
            font-weight: bolder;
        }
        
    </style>
</head>
<body>
    <div class="container">

        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
